    <rect x="18" y="18" width="58" height="58" rx="4" fill="none" stroke="url(#rock-b4)" stroke-width="2.5"/>
    <path d="M 24,68 C 24,34 34,24 68,24" fill="none" stroke="url(#flame-b4)" stroke-width="2.5"/>
    <polygon points="26,68 36,44 68,34 44,56" fill="url(#rock-b4)" stroke="#cc2200" stroke-width="0.8"/>
    <use href="#flame-ember-b4" transform="translate(48,48) scale(0.9)"/>
  </g>
