<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="none" width="100%" height="100%">
<defs>
      <linearGradient id="ink-woodcut" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b3126"/>
        <stop offset="100%" stop-color="#241d16"/>
      </linearGradient>
      <!-- Corner Acanthus Leaf Scroll -->
      <g id="corner-woodcut">
        <path d="M 16,16 L 80,16 Q 50,20 40,40 Q 20,50 16,80 Z" fill="url(#ink-woodcut)" opacity="0.15"/>
        <path d="M 20,20 C 35,20 65,25 75,45 C 55,42 45,55 42,75 C 25,65 20,35 20,20 Z" fill="url(#ink-woodcut)"/>
        <!-- Fine woodcut vein cuts (white lines) -->
        <path d="M 22,22 Q 40,35 60,42" fill="none" stroke="#fcf9f2" stroke-width="1.2"/>
        <path d="M 22,22 Q 35,40 40,65" fill="none" stroke="#fcf9f2" stroke-width="1.2"/>
        <path d="M 32,28 Q 45,30 52,38" fill="none" stroke="#fcf9f2" stroke-width="0.8"/>
        <path d="M 28,32 Q 30,45 38,52" fill="none" stroke="#fcf9f2" stroke-width="0.8"/>
        <!-- Corner rosette -->
        <circle cx="28" cy="28" r="5" fill="#c49d48"/>
        <circle cx="28" cy="28" r="2" fill="#241d16"/>
      </g>
      <!-- Repeating Foliate Ribbon Module for Edges -->
      <g id="leaf-module-h">
        <path d="M 0,26 C 15,18 25,34 40,26 C 25,32 15,20 0,26 Z" fill="url(#ink-woodcut)"/>
        <path d="M 0,26 Q 20,26 40,26" fill="none" stroke="#c49d48" stroke-width="0.8"/>
        <!-- Small berry cluster -->
        <circle cx="20" cy="21" r="2.2" fill="#c49d48"/>
        <circle cx="23" cy="23" r="1.8" fill="#8c2e2e"/>
      </g>
      <g id="leaf-module-v">
        <path d="M 26,0 C 18,15 34,25 26,40 C 32,25 20,15 26,0 Z" fill="url(#ink-woodcut)"/>
        <path d="M 26,0 Q 26,20 26,40" fill="none" stroke="#c49d48" stroke-width="0.8"/>
        <circle cx="21" cy="20" r="2.2" fill="#c49d48"/>
        <circle cx="23" cy="23" r="1.8" fill="#8c2e2e"/>
      </g>
    </defs>
