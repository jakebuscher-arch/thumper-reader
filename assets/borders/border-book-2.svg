<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="brass-b2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d791"/>
      <stop offset="50%" stop-color="#b88a38"/>
      <stop offset="100%" stop-color="#704d16"/>
    </linearGradient>
    <!-- Corner Escapement & Dial Assembly -->
    <g id="corner-b2">
      <rect x="24" y="24" width="70" height="70" fill="none" stroke="url(#brass-b2)" stroke-width="2" rx="2"/>
      <!-- Dial Ring -->
      <circle cx="59" cy="59" r="26" fill="none" stroke="url(#brass-b2)" stroke-width="1.5"/>
      <circle cx="59" cy="59" r="22" fill="none" stroke="#4a3312" stroke-width="0.8" stroke-dasharray="2,4"/>
      <!-- Minute Pointers -->
      <line x1="59" y1="35" x2="59" y2="39" stroke="url(#brass-b2)" stroke-width="1.8"/>
      <line x1="59" y1="79" x2="59" y2="83" stroke="url(#brass-b2)" stroke-width="1.8"/>
      <line x1="35" y1="59" x2="39" y2="59" stroke="url(#brass-b2)" stroke-width="1.8"/>
      <line x1="79" y1="59" x2="83" y2="59" stroke="url(#brass-b2)" stroke-width="1.8"/>
      <circle cx="59" cy="59" r="5" fill="url(#brass-b2)"/>
    </g>
  </defs>

  <!-- Precision Brass Perimeter Rules -->
  <rect x="24" y="24" width="752" height="952" rx="4" fill="none" stroke="url(#brass-b2)" stroke-width="2.5"/>
  <rect x="32" y="32" width="736" height="936" rx="2" fill="none" stroke="#5e4219" stroke-width="1.2"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="url(#brass-b2)" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- Four Precision Corners -->
  <use href="#corner-b2" x="0" y="0"/>
  <use href="#corner-b2" x="800" y="0" transform="scale(-1, 1)\/>
  <use href="#corner-b2" x="0" y="1000" transform="scale(1, -1)"/>
  <use href="#corner-b2" x="800" y="1000" transform="scale(-1, -1)"/>

  <!-- Left Margin Calibrated Track -->
  <line x1="32" y1="94" x2="32" y2="906" stroke="url(#brass-b2)" stroke-width="2"/>
  <line x1="28" y1="94" x2="28" y2="906" stroke="#5e4219" stroke-width="0.8" stroke-dasharray="4,8"/>

  <!-- Right Margin Calibrated Track -->
  <line x1="768" y1="94" x2="768" y2="906" stroke="url(#brass-b2)" stroke-width="2"/>
  <line x1="772" y1="94" x2="772" y2="906" stroke="#5e4219" stroke-width="0.8" stroke-dasharray="4,8"/>

  <!-- Top Margin Track -->
  <line x1="94" y1="32" x2="706" y2="32" stroke="url(#brass-b2)" stroke-width="2"/>
  <line x1="94" y1="28" x2="706" y2="28" stroke="#5e4219" stroke-width="0.8" stroke-dasharray="8,4"/>

  <!-- Bottom Margin Track -->
  <line x1="94" y1="968" x2="706" y2="968" stroke="url(#brass-b2)" stroke-width="2"/>
  <line x1="94" y1="972" x2="706" y2="972" stroke="#5e4219" stroke-width="0.8" stroke-dasharray="8,4"/>

  <!-- Top Center Escapement Bracket -->
  <g transform="translate(400, 32)">
    <rect x="-40" y="-10" width="80" height="20" rx="3" fill="#fbf7ee" stroke="url(#brass-b2)" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6" fill="url(#brass-b2)"/>
    <circle cx="-24" cy="0" r="3" fill="#5e4219"/>
    <circle cx="24" cy="0" r="3" fill="#5e4219"/>
  </g>

  <!-- Bottom Center Balance Weight -->
  <g transform="translate(400, 968)">
    <rect x="-40" y="-10" width="80" height="20" rx="3" fill="#fbf7ee" stroke="url(#brass-b2)" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6" fill="url(#brass-b2)"/>
    <circle cx="-24" cy="0" r="3" fill="#5e4219"/>
    <circle cx="24" cy="0" r="3" fill="#5e4219"/>
  </g>
</svg>