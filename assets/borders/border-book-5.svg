<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="none" width="100%" height="100%">
<defs>
      <linearGradient id="sepia-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#b88a38"/>
        <stop offset="100%" stop-color="#694d1b"/>
      </linearGradient>
      <!-- Renaissance Corner Scroll Bracket -->
      <g id="corner-renaissance">
        <path d="M 22,70 C 22,40 40,22 70,22" fill="none" stroke="url(#sepia-gold)" stroke-width="2.2"/>
        <path d="M 26,70 C 26,44 44,26 70,26" fill="none" stroke="url(#sepia-gold)" stroke-width="0.8"/>
        <!-- Classical Spiral Finial -->
        <path d="M 22,70 C 22,78 14,80 14,74 C 14,68 20,68 22,70 Z" fill="url(#sepia-gold)"/>
        <path d="M 70,22 C 78,22 80,14 74,14 C 68,14 68,20 70,22 Z" fill="url(#sepia-gold)"/>
        <!-- Central Corner Laurel Leaf & Classical Berries -->
        <path d="M 38,38 C 45,30 54,32 50,42 C 42,50 30,45 38,38 Z" fill="#385430" stroke="url(#sepia-gold)" stroke-width="0.6"/>
        <circle cx="38" cy="38" r="3" fill="url(#sepia-gold)"/>
        <circle cx="32" cy="46" r="1.6" fill="url(#sepia-gold)"/>
        <circle cx="46" cy="32" r="1.6" fill="url(#sepia-gold)"/>
      </g>
      <!-- Center Crown / Palmette with Imperial Wheat & Radiant Star -->
      <g id="center-palmette">
        <!-- Golden Wheat Sprigs of Harvest & Wisdom arching outward -->
        <g stroke="url(#sepia-gold)" fill="url(#sepia-gold)">
          <path d="M -4,-5 C -10,-10 -18,-11 -25,-10" fill="none" stroke-width="0.7"/>
          <ellipse cx="-13" cy="-9" rx="2.2" ry="1.1" transform="rotate(25 -13 -9)"/>
          <ellipse cx="-18" cy="-10.5" rx="2.2" ry="1.1" transform="rotate(15 -18 -10.5)"/>
          <ellipse cx="-23" cy="-10.5" rx="1.8" ry="0.9" transform="rotate(5 -23 -10.5)"/>
          
          <path d="M 4,-5 C 10,-10 18,-11 25,-10" fill="none" stroke-width="0.7"/>
          <ellipse cx="13" cy="-9" rx="2.2" ry="1.1" transform="rotate(-25 13 -9)"/>
          <ellipse cx="18" cy="-10.5" rx="2.2" ry="1.1" transform="rotate(-15 18 -10.5)"/>
          <ellipse cx="23" cy="-10.5" rx="1.8" ry="0.9" transform="rotate(-5 23 -10.5)"/>
        </g>
        <!-- Radiant Crown Finial -->
        <polygon points="0,-16 1.8,-11.5 5.5,-11.5 2.5,-9 3.5,-5 0,-7.5 -3.5,-5 -2.5,-9 -5.5,-11.5 -1.8,-11.5" fill="url(#sepia-gold)"/>
        <!-- Central Palmette Leaf -->
        <path d="M 0,-10 C -8,-2 -15,4 0,10 C 15,4 8,-2 0,-10 Z" fill="#385430" stroke="url(#sepia-gold)" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="3.5" fill="url(#sepia-gold)"/>
        <path d="M -25,0 Q -10,-8 0,0 Q 10,-8 25,0" fill="none" stroke="url(#sepia-gold)" stroke-width="1.2"/>
      </g>
    </defs>
<rect x="22" y="22" width="756" height="956" rx="6" fill="none" stroke="url(#sepia-gold)" stroke-width="1.8"/>
<rect x="30" y="30" width="740" height="940" rx="3" fill="none" stroke="url(#sepia-gold)" stroke-width="0.6"/>
<rect x="42" y="42" width="716" height="916" fill="none" stroke="url(#sepia-gold)" stroke-width="0.8" stroke-dasharray="6,4"/>
<use href="#corner-renaissance" x="0" y="0"/>
<use href="#corner-renaissance" transform="translate(800, 0) scale(-1, 1)"/>
<use href="#corner-renaissance" transform="translate(0, 1000) scale(1, -1)"/>
<use href="#corner-renaissance" transform="translate(800, 1000) scale(-1, -1)"/>
<use href="#center-palmette" x="400" y="22"/>
<use href="#center-palmette" x="400" y="978" transform="scale(1, -1)"/>
<use href="#center-palmette" x="22" y="500" transform="rotate(90)"/>
<use href="#center-palmette" x="778" y="500" transform="rotate(-90)"/>
</svg>