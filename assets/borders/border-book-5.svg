<defs>
  <linearGradient id="emerald-b5" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3b7d65"/>
    <stop offset="50%" stop-color="#1b4d3e"/>
    <stop offset="100%" stop-color="#0c2b22"/>
  </linearGradient>
  <linearGradient id="gold-b5" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fcedb6"/>
    <stop offset="50%" stop-color="#caa442"/>
    <stop offset="100%" stop-color="#7a5a17"/>
  </linearGradient>
  <linearGradient id="reed-b5" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#735233"/>
    <stop offset="50%" stop-color="#4d3319"/>
    <stop offset="100%" stop-color="#2d1c0c"/>
  </linearGradient>
  <!-- Reusable Cattail -->
  <g id="cattail-b5">
    <!-- Stem -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="url(#emerald-b5)" stroke-width="1.8"/>
    <!-- Cattail brown head -->
    <rect x="-3" y="-12" width="6" height="24" rx="3" fill="url(#reed-b5)" stroke="url(#gold-b5)" stroke-width="0.5"/>
    <!-- Spike tip -->
    <line x1="0" y1="-12" x2="0" y2="-18" stroke="url(#reed-b5)" stroke-width="1"/>
  </g>
  <!-- Reusable Golden Scarab Beetle -->
  <g id="scarab-b5">
    <!-- Outer gold shell / wings -->
    <ellipse cx="0" cy="0" rx="9" ry="12" fill="url(#gold-b5)" stroke="#543b10" stroke-width="0.8"/>
    <!-- Wing divider -->
    <line x1="0" y1="-7" x2="0" y2="12" stroke="#543b10" stroke-width="0.7"/>
    <!-- Pronotum (head shield) -->
    <path d="M -7,-6 C -7,-11 7,-11 7,-6 Z" fill="url(#emerald-b5)" stroke="#543b10" stroke-width="0.6"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="2.5" fill="url(#gold-b5)"/>
  </g>
  <!-- Corner Cartouche with Scarab & Water Lily -->
  <g id="corner-scarab-b5">
    <rect x="18" y="18" width="58" height="58" rx="5" fill="none" stroke="url(#emerald-b5)" stroke-width="2.5"/>
    <circle cx="47" cy="47" r="20" fill="none" stroke="url(#gold-b5)" stroke-width="1.2"/>
    <circle cx="47" cy="47" r="16" fill="none" stroke="url(#emerald-b5)" stroke-width="0.8" stroke-dasharray="2,3"/>
    <use href="#scarab-b5" transform="translate(47,47) scale(0.95)"/>
  </g>
